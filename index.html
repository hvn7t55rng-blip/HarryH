<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>简易笔记 (离线原型)</title>
<style>
  /* 应用样式（包括简化的 GitHub Markdown 风格） */
  :root{--bg:#fff;--muted:#666;--border:#e6e6e6}
  html,body{height:100%;}
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; height:100vh; display:flex; background:var(--bg); }
  #sidebar { width:320px; border-right:1px solid #ddd; padding:12px; box-sizing:border-box; overflow:auto; }
  #main { flex:1; display:flex; flex-direction:column; height:100vh; }
  .note-item { padding:8px; border-radius:6px; cursor:pointer; }
  .note-item.active { background:#f0f8ff; }
  header { display:flex; gap:8px; align-items:center; padding:8px; border-bottom:1px solid #eee; }
  .controls { display:flex; gap:8px; margin-left:auto; }
  .btn { padding:6px 10px; border:1px solid #bbb; background:#fff; border-radius:6px; cursor:pointer; }
  .btn.danger{ border-color:#e66; color:#a00; }
  .split { display:flex; flex:1; overflow:hidden; }
  .editor, .preview { flex:1; padding:12px; box-sizing:border-box; overflow:auto; }
  textarea, input[type="text"] { width:100%; box-sizing:border-box; padding:8px; font-size:14px; border:1px solid #ccc; border-radius:6px; }
  .tags { font-size:12px; color:var(--muted); margin-top:6px; }
  .search { margin-bottom:8px; }
  footer { padding:8px; border-top:1px solid #eee; font-size:13px; color:#555; }
  .meta { font-size:12px; color:#888; margin-top:6px; }
  /* 简化的 GitHub Markdown CSS：只覆盖常用元素 */
  .markdown-body{font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
  .markdown-body h1{font-size:1.6em;border-bottom:1px solid #eee;padding-bottom:.3em}
  .markdown-body h2{font-size:1.4em;border-bottom:1px solid #f6f8fa;padding-bottom:.2em}
  .markdown-body p{margin:0 0 8px 0}
  .markdown-body code{background:#f6f8fa;padding:.2em .4em;border-radius:6px}
  .markdown-body pre{background:#f6f8fa;padding:12px;border-radius:6px;overflow:auto}
  .markdown-body a{color:#0366d6}
  .markdown-body ul{padding-left:1.2em;margin:0 0 8px 0}
  .markdown-body ol{padding-left:1.2em;margin:0 0 8px 0}
  .markdown-body blockquote{color:#6a737d;padding:0 1em;border-left:4px solid #dfe2e5;margin:0 0 8px 0}
</style>
</head>
<body>
  <div id="sidebar">
    <div class="search">
      <input id="searchInput" placeholder="搜索标题/内容/标签..." />
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <button id="newBtn" class="btn">新建</button>
      <button id="exportBtn" class="btn">导出 JSON</button>
      <button id="importBtn" class="btn">导入 JSON</button>
      <input id="importFile" type="file" accept="application/json" style="display:none" />
    </div>
    <div id="notesList"></div>
  </div>

  <div id="main">
    <header>
      <div style="display:flex;flex-direction:column;">
        <input id="titleInput" placeholder="标题" />
        <input id="tagsInput" placeholder="标签（逗号分隔）" style="margin-top:6px" />
        <div class="meta" id="metaInfo"></div>
      </div>
      <div class="controls">
        <button id="saveBtn" class="btn">保存 (Ctrl+S)</button>
        <button id="deleteBtn" class="btn danger">删除</button>
      </div>
    </header>

    <div class="split">
      <div class="editor">
        <textarea id="contentInput" rows="20" placeholder="在此输入 Markdown 内容..."></textarea>
      </div>
      <div class="preview markdown-body" id="preview" style="border-left:1px solid #eee;"></div>
    </div>

    <footer>
      离线包 — 数据保存在浏览器 localStorage。该页面已被部署到 GitHub Pages，可离线打开。
    </footer>
  </div>

<script>
/* 简易笔记应用 —— 完全离线，包含一个极简 Markdown 渲染器（覆盖常用语法） */
const STORAGE_KEY = 'simple_notes_v1_offline';
let notes = [];
let currentId = null;
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function load(){ try{ notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }catch(e){ notes=[];} renderList(); }
function saveAll(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }
function newNote(){ const n = { id: uid(), title: '新笔记', tags: [], content: '# 新笔记\n\n在此输入内容', updatedAt: new Date().toISOString() }; notes.unshift(n); currentId=n.id; saveAll(); renderList(); renderCurrent(); }
function deleteCurrent(){ if(!currentId) return; if(!confirm('确认删除当前笔记？')) return; notes = notes.filter(n=>n.id!==currentId); currentId = notes.length? notes[0].id : null; saveAll(); renderList(); renderCurrent(); }
function saveCurrent(){ if(!currentId) return; const n = notes.find(x=>x.id===currentId); if(!n) return; n.title = document.getElementById('titleInput').value.trim() || '无标题'; n.tags = document.getElementById('tagsInput').value.split(',').map(s=>s.trim()).filter(Boolean); n.content = document.getElementById('contentInput').value; n.updatedAt = new Date().toISOString(); notes = [n, ...notes.filter(x=>x.id!==currentId)]; currentId = n.id; saveAll(); renderList(); renderCurrent(false); }
function renderList(filter=''){ const container = document.getElementById('notesList'); container.innerHTML=''; const q = filter.trim().toLowerCase(); for(const n of notes){ const hay = (n.title + ' ' + n.content + ' ' + (n.tags||[]).join(' ')).toLowerCase(); if(q && !hay.includes(q)) continue; const div = document.createElement('div'); div.className = 'note-item' + (n.id===currentId? ' active':''); div.innerHTML = `<strong>${escapeHtml(n.title)}</strong><div class=\"tags\">${(n.tags||[]).map(t=>'#'+escapeHtml(t)).join(' ')}</div><div class=\"meta\">${new Date(n.updatedAt).toLocaleString()}</div>`; div.onclick = ()=>{ currentId = n.id; renderCurrent(); }; container.appendChild(div); } }
function renderCurrent(focus=true){ const title = document.getElementById('titleInput'); const tags = document.getElementById('tagsInput'); const content = document.getElementById('contentInput'); const preview = document.getElementById('preview'); const meta = document.getElementById('metaInfo'); if(!currentId){ if(notes.length){ currentId = notes[0].id; } else { title.value=''; tags.value=''; content.value=''; preview.innerHTML=''; meta.textContent=''; renderList(); return; } }
 const n = notes.find(x=>x.id===currentId); if(!n) return; title.value = n.title; tags.value = (n.tags||[]).join(', '); content.value = n.content; preview.innerHTML = renderMarkdown(n.content || '*空内容*'); meta.textContent = `最后保存： ${new Date(n.updatedAt).toLocaleString()} • id: ${n.id}`; renderList(document.getElementById('searchInput').value); if(focus) content.focus(); }
function escapeHtml(s){ return String(s).replace(/[&<>"]+/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] || c; }); }

/* 极简 Markdown 渲染器：处理代码块、行内代码、标题、加粗/斜体、链接、无序/有序列表、blockquote、段落 */
function renderMarkdown(md){ if(!md) return '';
 // 保护空行
 md = md.replace(/\r/g,'');
 // 代码块 ```lang\n...\n```
 md = md.replace(/```([\s\S]*?)```/g, function(m, p1){ return '<pre><code>'+escapeHtml(p1)+'</code></pre>'; });
 // 行内代码 `code`
 md = md.replace(/`([^`]+)`/g, function(m,p1){ return '<code>'+escapeHtml(p1)+'</code>'; });
 // headings
 md = md.replace(/^######\s*(.*)$/gm, '<h6>$1</h6>');
 md = md.replace(/^#####\s*(.*)$/gm, '<h5>$1</h5>');
 md = md.replace(/^####\s*(.*)$/gm, '<h4>$1</h4>');
 md = md.replace(/^###\s*(.*)$/gm, '<h3>$1</h3>');
 md = md.replace(/^##\s*(.*)$/gm, '<h2>$1</h2>');
 md = md.replace(/^#\s*(.*)$/gm, '<h1>$1</h1>');
 // blockquote
 md = md.replace(/^>\s?(.*)$/gm, '<blockquote>$1</blockquote>');
 // unordered lists (simple)
 md = md.replace(/(^|\n)([ \t]*[-\*+]\s+(.+)(\n|$))+?/g, function(m){ // process group
   const items = m.trim().split(/\n/).map(line=>line.replace(/^[-\*+]\s+/,'')).filter(Boolean);
   return '<ul>' + items.map(i=>'<li>'+inline(i)+'</li>').join('') + '</ul>';
 });
 // ordered lists
 md = md.replace(/(^|\n)(\d+\.\s+(.+)(\n|$))+?/g, function(m){ const items = m.trim().split(/\n/).map(line=>line.replace(/^\d+\.\s+/,'')).filter(Boolean); return '<ol>' + items.map(i=>'<li>'+inline(i)+'</li>').join('') + '</ol>'; });
 // horizontal rule
 md = md.replace(/^[-\*]{3,}$/gm, '<hr/>');
 // bold and italic
 md = md.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
 md = md.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
 // links [text](url)
 md = md.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
 // paragraphs: split by double line breaks
 const parts = md.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean).map(p=>{
   // if already wrapped in block-level tag, keep
   if(/^<h\d|^<ul|^<ol|^<pre|^<blockquote|^<hr|^<p/.test(p)) return p;
   return '<p>'+inline(p)+'</p>';
 });
 return parts.join('\n');
}
function inline(text){ // escape then allow simple inline formatting already applied
 text = escapeHtml(text);
 // restore some already-transformed tags (code, strong, em, a) by reversing escape for < and > within tags
 text = text.replace(/&lt;(\/)?(code|strong|em|a)([^&]*)&gt;/g, function(m, p1, p2, p3){ return '<'+(p1?'/':'')+p2+ (p3||'') + '>'; });
 // allow links already transformed
 return text;
}

/* 事件绑定 */
document.getElementById('searchInput').addEventListener('input', e=>renderList(e.target.value));
document.getElementById('newBtn').addEventListener('click', newNote);
document.getElementById('saveBtn').addEventListener('click', saveCurrent);
document.getElementById('deleteBtn').addEventListener('click', deleteCurrent);
document.getElementById('contentInput').addEventListener('input', ()=>{ document.getElementById('preview').innerHTML = renderMarkdown(document.getElementById('contentInput').value || ''); });
document.addEventListener('keydown', e=>{ if(e.ctrlKey && e.key.toLowerCase()==='s'){ e.preventDefault(); saveCurrent(); } if(e.ctrlKey && e.key.toLowerCase()==='n'){ e.preventDefault(); newNote(); } });

/* 导出/导入 */
document.getElementById('exportBtn').addEventListener('click', ()=>{ const blob = new Blob([JSON.stringify(notes, null, 2)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'notes_export.json'; a.click(); URL.revokeObjectURL(a.href); });
document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{ const f = e.target.files[0]; if(!f) return; const reader = new FileReader(); reader.onload = ev=>{ try{ const imported = JSON.parse(ev.target.result); if(!Array.isArray(imported)) throw new Error('格式错误'); const existingIds = new Set(notes.map(n=>n.id)); for(const it of imported){ if(!it.id || existingIds.has(it.id)) it.id = uid(); notes.push(it); } saveAll(); renderList(); alert('导入完成'); }catch(err){ alert('导入失败：' + err.message); } }; reader.readAsText(f); e.target.value=''; });

load(); if(!notes.length) newNote(); renderCurrent(false);
</script>
</body>
</html>
